name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Enabled in the follow-up that adds the eslint config.
      # - name: Lint
      #   run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Proves the app compiles. The deploy job builds its own artifact through
      # `vercel build`; this one is thrown away, hence the placeholder
      # credential — Vite inlines import.meta.env at build time, so a real one
      # would only end up in a discarded bundle.
      - name: Build
        run: npm run build
        env:
          VITE_TMDB_API_KEY: build-check-not-a-real-credential

      # The version in the tag and the version in the artifact must agree, or
      # the release is labelled with a version that exists nowhere in it.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag v$TAG matches package.json."

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    # Forks cannot read secrets, so this would sit red forever on their PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Until the Vercel project is linked and its secrets are set, every step
      # below skips with a notice rather than failing. A red X on each push
      # says nothing useful. The `secrets` context cannot be read from a
      # job-level `if`, so this has to be a step.
      - name: Check Vercel is configured
        id: cfg
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel is not configured — set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to enable deploys. See the README."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Work out the target environment
        id: env
        if: steps.cfg.outputs.configured == 'true'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      # Pulls the project's env vars into .vercel/. This is why the TMDB
      # credential lives in the Vercel dashboard only and is never duplicated
      # into GitHub secrets.
      - name: Pull Vercel environment
        if: steps.cfg.outputs.configured == 'true'
        run: npx vercel@latest pull --yes --environment=${{ steps.env.outputs.target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.cfg.outputs.configured == 'true'
        run: npx vercel@latest build ${{ steps.env.outputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.configured == 'true'
        run: |
          URL=$(npx vercel@latest deploy --prebuilt ${{ steps.env.outputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      # Deploying by CLI rather than the git integration means CI is the gate,
      # but it also costs the integration's automatic PR comment. This puts it
      # back.
      - name: Comment the preview URL on the PR
        if: steps.cfg.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
